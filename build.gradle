plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'   // ← Понизил до стабильной версии
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ru.paul'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()   // ← Убедитесь, что репозиторий указан
}

dependencies {
	// Правильный стартер для Spring Boot 3.x
	implementation 'org.springframework.boot:spring-boot-starter-web'  // ← изменил webmvc → web

	// Для тестов
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'
	testCompileOnly 'org.projectlombok:lombok:1.18.36'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

	// Apache POI для Excel
	implementation 'org.apache.poi:poi-ooxml:5.3.0'

	// Swagger (OpenAPI 3)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'


}

tasks.named('test') {
	useJUnitPlatform()
}